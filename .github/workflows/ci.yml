name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Emoji lint
        run: |
          if grep -rP '[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}\x{FE0F}]' src/; then
            echo "::error::Emojis are not allowed in src/"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build
